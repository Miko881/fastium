name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Analyze Rust
        run: cargo clippy --all-targets
      - name: Build, test and check size
        shell: pwsh
        run: ./scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Fastium-windows-x64
          path: |
            dist/*.zip
            Cargo.lock

