[package]
name = "fastium"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
description = "Minimal Windows browser powered by the system WebView2 runtime"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[target.'cfg(windows)'.dependencies]
tao = "=0.31.1"
wry = { version = "=0.48.1", default-features = false, features = ["os-webview"] }
webview2-com = "=0.34.0"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

